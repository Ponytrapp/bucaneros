<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a" id="themeColorMeta">
    <title>Bucaneros</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a1517;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', serif;
            user-select: none;
            -webkit-user-select: none;
            animation: fadeInBody 1.8s ease-out;
            margin: 0;
            padding: 0;
            position: relative;
        }

        @keyframes fadeInBody {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* ===== ТЕМЫ ===== */
        body.theme-0 .sky-layer { background: linear-gradient(180deg, #faf8f4 0%, #f0ece4 40%, #e8e4dc 70%, #ddd8ce 100%); }
        body.theme-0 .ocean-layer { background: linear-gradient(180deg, #0d1b1e 0%, #0a1517 30%, #060e0f 100%); }
        body.theme-0 .moon-body { background: radial-gradient(circle at 40% 35%, #ff3b1f, #c4200a 50%, #8b0000 80%); box-shadow: 0 0 50px rgba(255,50,20,0.5); }
        body.theme-0 .sub-text { color: rgba(255,255,255,0.75); }
        body.theme-0 .back-btn { border-color: rgba(255,255,255,0.5); color: #ffffff; }
        body.theme-0 .theme-indicator { color: rgba(255,255,255,0.6); }

        body.theme-1 .sky-layer { background: linear-gradient(180deg, #8b1a1a 0%, #6b1010 40%, #4a0808 70%, #2a0404 100%); }
        body.theme-1 .ocean-layer { background: linear-gradient(180deg, #f5f0e8 0%, #ede6da 30%, #e5dcd0 100%); }
        body.theme-1 .moon-body { background: radial-gradient(circle at 40% 35%, #1a1a1a, #0a0a0a 60%, #000000 90%); box-shadow: 0 0 40px rgba(0,0,0,0.4); }
        body.theme-1 .sub-text { color: rgba(26,26,26,0.7); }
        body.theme-1 .back-btn { border-color: rgba(26,26,26,0.5); color: #1a1a1a; }
        body.theme-1 .theme-indicator { color: rgba(26,26,26,0.6); }

        body.theme-2 .sky-layer { background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 40%, #050505 70%, #000000 100%); }
        body.theme-2 .ocean-layer { background: linear-gradient(180deg, #8b1a0a 0%, #6b0f05 30%, #4a0802 100%); }
        body.theme-2 .moon-body { background: radial-gradient(circle at 40% 35%, #ffffff, #e8e8e8 50%, #cccccc 80%); box-shadow: 0 0 60px rgba(255,255,255,0.6); }
        body.theme-2 .sub-text { color: rgba(255,255,255,0.75); }
        body.theme-2 .back-btn { border-color: rgba(255,255,255,0.5); color: #ffffff; }

        body.theme-3 .sky-layer { background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 40%, #050505 70%, #000000 100%); }
        body.theme-3 .ocean-layer { background: linear-gradient(180deg, #f5f0e8 0%, #ede6da 30%, #e5dcd0 100%); }
        body.theme-3 .moon-body { background: radial-gradient(circle at 40% 35%, #ff3b1f, #c4200a 50%, #8b0000 80%); box-shadow: 0 0 50px rgba(255,50,20,0.6); }
        body.theme-3 .sub-text { color: rgba(26,26,26,0.7); }
        body.theme-3 .back-btn { border-color: rgba(26,26,26,0.5); color: #1a1a1a; }

        /* ===== СЛОИ ===== */
        .sky-layer { position: absolute; top: 0; left: 0; width: 100%; height: 40%; z-index: 1; transition: background 1.2s ease; }
        .ocean-layer { position: absolute; bottom: 0; left: 0; width: 100%; height: 65%; z-index: 3; transition: background 1.2s ease; overflow: hidden; }

        /* ЛУНА */
        .moon-container { position: absolute; top: 12%; right: 16%; z-index: 2; }
        .moon-body { width: clamp(55px, 10vw, 90px); height: clamp(55px, 10vw, 90px); border-radius: 50%; transition: all 1.2s ease; position: relative; }
        .moon-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 130%; height: 130%; border-radius: 50%; pointer-events: none; animation: glowPulse 3s ease-in-out infinite; }
        @keyframes glowPulse { 0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } }

        /* АТМОСФЕРА */
        .atmosphere-layer { position: absolute; top: 0; left: 0; width: 100%; height: 40%; z-index: 2; pointer-events: none; }
        .atmo-particle { position: absolute; border-radius: 50%; }

        /* ВОЛНЫ */
        .wave-row { position: absolute; bottom: 0; left: 0; width: 100%; }
        .wave-row svg { width: 100%; display: block; }
        .wave-1 { height: 55%; bottom: 0; opacity: 0.85; animation: waveDrift1 10s ease-in-out infinite; }
        .wave-2 { height: 50%; bottom: -5%; opacity: 0.75; animation: waveDrift2 8s ease-in-out infinite; }
        .wave-3 { height: 45%; bottom: -8%; opacity: 0.9; animation: waveDrift3 7s ease-in-out infinite; }
        .wave-4 { height: 35%; bottom: -10%; opacity: 0.95; animation: waveDrift4 6s ease-in-out infinite; }

        @keyframes waveDrift1 { 0%,100% { transform: translateX(0); } 30% { transform: translateX(1.5%); } 60% { transform: translateX(-0.5%); } }
        @keyframes waveDrift2 { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2%); } 55% { transform: translateX(1%); } }
        @keyframes waveDrift3 { 0%,100% { transform: translateX(0); } 40% { transform: translateX(1.8%); } 70% { transform: translateX(-1.2%); } }
        @keyframes waveDrift4 { 0%,100% { transform: translateX(0); } 35% { transform: translateX(-1.5%); } 65% { transform: translateX(0.8%); } }

        /* ПЕНА, БРЫЗГИ, БЛИКИ */
        .foam-particles, .spray-layer, .glitter-layer { position: absolute; bottom: 0; left: 0; width: 100%; pointer-events: none; z-index: 4; }
        .foam-blob { position: absolute; border-radius: 50%; animation: foamFloat var(--fd) ease-in-out infinite; }
        @keyframes foamFloat { 0% { opacity: 0; } 15% { opacity: 0.7; } 100% { opacity: 0; transform: translateY(-30px); } }

        /* КОНТЕНТ */
        .content-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .message-block { text-align: center; width: 90%; max-width: 500px; pointer-events: auto; }
        .sub-text { font-size: clamp(0.8rem, 2vw, 1rem); letter-spacing: 4px; text-transform: uppercase; margin-top: 1rem; }

        /* КАРУСЕЛЬ */
        .carousel-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden; margin-bottom: 1.2rem; box-shadow: 0 8px 32px rgba(0,0,0,0.3); touch-action: pan-y pinch-zoom; }
        .carousel-track { position: relative; display: flex; width: 100%; height: 100%; transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1); will-change: transform; }
        .carousel-slide { min-width: 100%; flex-shrink: 0; }
        .carousel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .carousel-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; font-size: 1.5rem; cursor: pointer; z-index: 15; display: flex; align-items: center; justify-content: center; }
        .carousel-prev { left: 12px; }
        .carousel-next { right: 12px; }
        
        .carousel-dots { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; z-index: 15; }
        .carousel-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.5); cursor: pointer; border: none; transition: all 0.3s; }
        .carousel-dot.active { background: #ffffff; transform: scale(1.4); }

        /* ИНДИКАТОР ТЕМЫ */
        .theme-indicator { position: absolute; top: clamp(15px, 3vh, 28px); left: 50%; transform: translateX(-50%); z-index: 20; font-size: clamp(0.55rem, 1.2vw, 0.7rem); letter-spacing: 4px; text-transform: uppercase; pointer-events: none; }

        /* КНОПКА НАЗАД */
        .back-btn-wrapper { position: absolute; bottom: clamp(30px, 7vh, 50px); left: 0; width: 100%; z-index: 20; display: flex; justify-content: center; }
        .back-btn { display: inline-flex; align-items: center; justify-content: center; border: 1px solid; padding: 0.7rem 2rem; font-family: inherit; font-size: clamp(0.7rem, 1.8vw, 0.85rem); letter-spacing: 3px; text-transform: uppercase; cursor: pointer; text-decoration: none; backdrop-filter: blur(4px); }

        /* ОВЕРЛЕЙ */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
        .overlay.active { pointer-events: auto; opacity: 1; }
        .overlay-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(20px); }
        .overlay-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; max-width: 90vw; }
        .overlay-image { max-width: 100%; max-height: 55vh; object-fit: contain; border-radius: 8px; }
        .overlay-info { text-align: center; margin-top: 1.5rem; }
        .overlay-title { color: white; font-size: 1.5rem; margin-bottom: 0.5rem; }
        .overlay-desc { color: rgba(255,255,255,0.8); margin-bottom: 1rem; }
        .overlay-btn, .overlay-close { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; cursor: pointer; padding: 0.5rem 1rem; border-radius: 4px; }
        .overlay-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; }
    </style>
</head>
<body class="theme-0">

    <div class="sky-layer"></div>
    <div class="moon-container" id="moonContainer">
        <div class="moon-glow"></div>
        <div class="moon-body"></div>
    </div>
    <div class="atmosphere-layer" id="atmosphereLayer"></div>
    <div class="ocean-layer" id="oceanLayer"></div>
    <div class="foam-particles" id="foamLayer"></div>
    <div class="spray-layer" id="sprayLayer"></div>
    <div class="glitter-layer" id="glitterLayer"></div>
    
    <div class="theme-indicator" id="themeIndicator">Чёрное море · Белое небо</div>

    <div class="content-layer">
        <div class="message-block">
            <div class="carousel-wrapper" id="carouselWrapper">
                <div class="carousel-track" id="carouselTrack">
                    <div class="carousel-slide" data-title="v1" data-desc="Настоящий буканьер не пукает по ветру">
                        <img src="IMG_1.webp" alt="slide1" onerror="this.style.display='none'">
                    </div>
                    <div class="carousel-slide" data-title="v2" data-desc="Под этим флагом нет места трусости, только тревога">
                        <img src="IMG_2.webp" alt="slide2" onerror="this.style.display='none'">
                    </div>
                    <div class="carousel-slide" data-title="v3" data-desc="Золото - это металл, а мы работаем с деревом">
                        <img src="IMG_3.webp" alt="slide3" onerror="this.style.display='none'">
                    </div>
                </div>
                <div class="carousel-dots" id="carouselDots"></div>
                <button class="carousel-arrow carousel-prev" id="carouselPrev">‹</button>
                <button class="carousel-arrow carousel-next" id="carouselNext">›</button>
            </div>
            <p class="sub-text">Bucaneros</p>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="overlay-bg" id="overlayBg"></div>
        <div class="overlay-content">
            <img src="" alt="" class="overlay-image" id="overlayImage">
            <div class="overlay-info">
                <h3 class="overlay-title" id="overlayTitle"></h3>
                <p class="overlay-desc" id="overlayDesc"></p>
                <button class="overlay-btn" id="overlayBtn">Закрыть</button>
            </div>
        </div>
        <button class="overlay-close" id="overlayClose">✕</button>
    </div>

    <div class="back-btn-wrapper">
        <a href="index.html" class="back-btn">← На главную</a>
    </div>

    <script>
        const themeData = [
            { name: 'Чёрное море · Белое небо', waveColors: ['#0f2024', '#0a181c', '#081215', '#061014'], foamColors: ['#1a3038', '#14262d', '#0f1e24'], isDarkSky: false },
            { name: 'Белое море · Красное небо', waveColors: ['#faf6f0', '#f0eae0', '#e8e0d4', '#e0d8cc'], foamColors: ['#e0d8cc', '#d8cec0', '#d0c8b8'], isDarkSky: true },
            { name: 'Красное море · Чёрное небо', waveColors: ['#9b2a15', '#7a1808', '#5a0d03', '#3a0500'], foamColors: ['#a04030', '#803020', '#602010'], isDarkSky: true },
            { name: 'Белое море · Чёрное небо', waveColors: ['#faf6f0', '#f0eae0', '#e8e0d4', '#e0d8cc'], foamColors: ['#e0d8cc', '#d8cec0', '#d0c8b8'], isDarkSky: true }
        ];

        let currentTheme = 0;

        function generateWavePath(seed, complexity) {
            let path = 'M0 60 ';
            const points = 12 + complexity;
            for (let i = 1; i <= points; i++) {
                const x = (i / points) * 100;
                const y = 40 + Math.sin(i * seed * 0.7 + seed) * 18;
                path += `L${x} ${y} `;
            }
            path += 'L100 100 L0 100 Z';
            return path;
        }

        function buildWaves() {
            const ocean = document.getElementById('oceanLayer');
            ocean.innerHTML = '';
            const configs = [
                { cls: 'wave-1', seed: 1.2, complexity: 6 },
                { cls: 'wave-2', seed: 2.5, complexity: 8 },
                { cls: 'wave-3', seed: 3.8, complexity: 10 },
                { cls: 'wave-4', seed: 5.1, complexity: 7 }
            ];
            configs.forEach((cfg, idx) => {
                const row = document.createElement('div');
                row.className = 'wave-row ' + cfg.cls;
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('viewBox', '0 0 100 100');
                svg.setAttribute('preserveAspectRatio', 'none');
                svg.style.width = '100%';
                svg.style.height = '100%';
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', generateWavePath(cfg.seed, cfg.complexity));
                path.setAttribute('fill', themeData[currentTheme].waveColors[idx]);
                path.classList.add('wave-path');
                svg.appendChild(path);
                row.appendChild(svg);
                ocean.appendChild(row);
            });
        }

        function applyTheme(idx) {
            currentTheme = idx;
            document.body.className = 'theme-' + idx;
            document.getElementById('themeIndicator').textContent = themeData[idx].name;
            buildWaves();
        }

        // Свайп для смены темы
        let touchStartY = 0;
        document.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; });
        document.addEventListener('touchend', e => {
            const diff = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(diff) > 55) {
                if (diff > 0) applyTheme((currentTheme + 1) % 4);
                else applyTheme((currentTheme - 1 + 4) % 4);
            }
        });

        // КАРУСЕЛЬ
        const track = document.getElementById('carouselTrack');
        const dotsContainer = document.getElementById('carouselDots');
        const prevBtn = document.getElementById('carouselPrev');
        const nextBtn = document.getElementById('carouselNext');
        const slides = Array.from(document.querySelectorAll('.carousel-slide'));
        const totalSlides = slides.length;

        // Клонирование для бесконечности
        const firstClone = slides[0].cloneNode(true);
        const lastClone = slides[totalSlides - 1].cloneNode(true);
        firstClone.classList.add('clone');
        lastClone.classList.add('clone');
        track.appendChild(firstClone);
        track.insertBefore(lastClone, slides[0]);

        const allSlides = track.querySelectorAll('.carousel-slide');
        const extendedTotal = allSlides.length;
        let currentIndex = 1;
        let isTransitioning = false;
        let autoplayInterval;

        track.style.transform = `translateX(-${currentIndex * 100}%)`;

        // Создание точек
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('button');
            dot.classList.add('carousel-dot');
            if (i === 0) dot.classList.add('active');
            dot.addEventListener('click', () => { if (!isTransitioning) goToRealSlide(i); resetAutoplay(); });
            dotsContainer.appendChild(dot);
        }
        const dots = document.querySelectorAll('.carousel-dot');

        function updateDots() {
            let realIndex = currentIndex - 1;
            if (currentIndex === 0) realIndex = totalSlides - 1;
            if (currentIndex === extendedTotal - 1) realIndex = 0;
            dots.forEach((d, i) => d.classList.toggle('active', i === realIndex));
        }

        function goToSlide(index, animate = true) {
            if (isTransitioning && animate) return;
            isTransitioning = true;
            currentIndex = index;
            track.style.transition = animate ? 'transform 0.7s cubic-bezier(0.4, 0, 0.2, 1)' : 'none';
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            updateDots();
            if (!animate) { track.offsetHeight; isTransitioning = false; }
        }

        function goToRealSlide(realIndex) { goToSlide(realIndex + 1); }

        track.addEventListener('transitionend', () => {
            isTransitioning = false;
            if (currentIndex === 0) goToSlide(extendedTotal - 2, false);
            else if (currentIndex === extendedTotal - 1) goToSlide(1, false);
        });

        function nextSlide() { if (!isTransitioning) goToSlide(currentIndex + 1); }
        function prevSlide() { if (!isTransitioning) goToSlide(currentIndex - 1); }

        prevBtn.addEventListener('click', () => { prevSlide(); resetAutoplay(); });
        nextBtn.addEventListener('click', () => { nextSlide(); resetAutoplay(); });

        function startAutoplay() { autoplayInterval = setInterval(nextSlide, 4000); }
        function resetAutoplay() { clearInterval(autoplayInterval); startAutoplay(); }
        startAutoplay();

        // Свайп в карусели
        let touchStartX = 0, touchEndX = 0;
        const wrapper = document.querySelector('.carousel-wrapper');
        wrapper.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; clearInterval(autoplayInterval); });
        wrapper.addEventListener('touchend', e => {
            const diff = touchStartX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 30) diff > 0 ? nextSlide() : prevSlide();
            resetAutoplay();
        });

        // Оверлей по тапу
        const overlay = document.getElementById('overlay');
        const overlayImg = document.getElementById('overlayImage');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayDesc = document.getElementById('overlayDesc');
        const overlayBtnClose = document.getElementById('overlayBtn');
        const overlayCloseBtn = document.getElementById('overlayClose');
        const overlayBg = document.getElementById('overlayBg');

        function closeOverlay() {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
            startAutoplay();
        }

        wrapper.addEventListener('click', (e) => {
            if (e.target.closest('.carousel-arrow') || e.target.closest('.carousel-dot')) return;
            const slide = e.target.closest('.carousel-slide');
            if (!slide || slide.classList.contains('clone')) return;
            const img = slide.querySelector('img');
            const title = slide.getAttribute('data-title') || 'Без названия';
            const desc = slide.getAttribute('data-desc') || '';
            overlayImg.src = img.src;
            overlayTitle.textContent = title;
            overlayDesc.textContent = desc;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            clearInterval(autoplayInterval);
        });

        overlayCloseBtn.addEventListener('click', closeOverlay);
        overlayBtnClose.addEventListener('click', closeOverlay);
        overlayBg.addEventListener('click', closeOverlay);

        // Инициализация
        buildWaves();
        for (let i = 0; i < 30; i++) {
            const dot = document.createElement('div');
            dot.classList.add('spray-dot');
            document.getElementById('sprayLayer').appendChild(dot);
        }
    </script>
</body>
</html>
