<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#0a0a0a" id="themeColorMeta">
    <title>Море зовёт — Bucaneros del Mar de Sangre</title>
    
    <!-- МГНОВЕННЫЙ ФИКС НАВБАРА -->
    <script>
        // Сразу делаем навбар тёмным, ещё до загрузки CSS
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0a0a');
        
        // Слушаем момент, когда DOM готов — применяем тему
        document.addEventListener('DOMContentLoaded', function() {
            // Принудительно обновляем через 50ms после загрузки
            setTimeout(function() {
                var meta = document.getElementById('themeColorMeta');
                if (meta && document.body.classList.contains('theme-0')) {
                    meta.setAttribute('content', '#0a1517');
                }
            }, 50);
        });
    </script>
    
    <style>
        * 
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        /* Фиксы для iOS */

        --ocean-color: #0a1517;
              }

        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        font-family: 'Georgia', 'Times New Roman', serif;

        -webkit-user-select: none;

        -webkit-overscroll-behavior: none;

            }

        @keyframes fadeInBody {
            0% { opacity: 0; }

body.theme-0 .sky-layer {

        /* ===== СЛОИ ===== */
        .sky-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 40%;
            z-index: 1;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ocean-layer {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 65%;
            z-index: 3;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* ===== ЛУНА ===== */
        .moon-container {
            position: absolute;
            top: 12%;
            right: 16%;
            z-index: 2;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .moon-body {
            width: clamp(55px, 10vw, 90px);
            height: clamp(55px, 10vw, 90px);
            border-radius: 50%;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        /* кратеры */
        .moon-body::before {
            content: '';
            position: absolute;
            width: 22%; height: 22%;
            border-radius: 50%;
            top: 25%; left: 30%;
            background: rgba(0,0,0,0.15);
        }
        .moon-body::after {
            content: '';
            position: absolute;
            width: 14%; height: 14%;
            border-radius: 50%;
            top: 55%; left: 55%;
            background: rgba(0,0,0,0.1);
        }
        /* свечение */
        .moon-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 130%; height: 130%;
            border-radius: 50%;
            pointer-events: none;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            animation: glowPulse 3s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
        }

        /* ===== ЗВЁЗДЫ / ОБЛАКА ===== */
        .atmosphere-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 40%;
            z-index: 2;
            pointer-events: none;
            transition: opacity 1.2s ease;
        }
        .atmo-particle {
            position: absolute;
            border-radius: 50%;
            transition: all 1.2s ease;
        }

        /* ===== ВОЛНЫ ===== */
        .wave-set {
            position: absolute;
            bottom: 0;
            left: -10%;
            width: 130%;
            height: 100%;
        }
        .wave-row {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
        }
        .wave-row svg {
            width: 100%;
            display: block;
        }
        .wave-row path {
            transition: fill 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* волна 1 — дальняя */
        .wave-1 { height: 55%; bottom: 0; opacity: 0.85; }
        .wave-1-anim { animation: waveDrift1 10s ease-in-out infinite; }

        /* волна 2 — средняя */
        .wave-2 { height: 50%; bottom: -5%; opacity: 0.75; }
        .wave-2-anim { animation: waveDrift2 8s ease-in-out infinite; }

        /* волна 3 — ближняя */
        .wave-3 { height: 45%; bottom: -8%; opacity: 0.9; }
        .wave-3-anim { animation: waveDrift3 7s ease-in-out infinite; }

        /* волна 4 — передняя, пенистая */
        .wave-4 { height: 35%; bottom: -10%; opacity: 0.95; }
        .wave-4-anim { animation: waveDrift4 6s ease-in-out infinite; }

        @keyframes waveDrift1 {
            0%, 100% { transform: translateX(0) translateY(0); }
            30% { transform: translateX(1.5%) translateY(-3px); }
            60% { transform: translateX(-0.5%) translateY(-5px); }
            85% { transform: translateX(1%) translateY(-2px); }
        }
        @keyframes waveDrift2 {
            0%, 100% { transform: translateX(0) translateY(0); }
            25% { transform: translateX(-2%) translateY(-4px); }
            55% { transform: translateX(1%) translateY(-7px); }
            75% { transform: translateX(-1%) translateY(-3px); }
        }
        @keyframes waveDrift3 {
            0%, 100% { transform: translateX(0) translateY(0); }
            40% { transform: translateX(1.8%) translateY(-5px); }
            70% { transform: translateX(-1.2%) translateY(-3px); }
        }
        @keyframes waveDrift4 {
            0%, 100% { transform: translateX(0) translateY(0); }
            35% { transform: translateX(-1.5%) translateY(-4px); }
            65% { transform: translateX(0.8%) translateY(-6px); }
        }

        /* ===== ПЕНА НА ГРЕБНЯХ ===== */
        .foam-particles {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 40%;
            z-index: 4;
            pointer-events: none;
        }
        .foam-blob {
            position: absolute;
            border-radius: 50%;
            animation: foamFloat var(--fd) ease-in-out infinite;
            animation-delay: var(--fdel);
            bottom: var(--fy);
            left: var(--fx);
            width: var(--fw);
            height: var(--fh);
            opacity: 0;
            transition: background 1.2s ease;
        }
        @keyframes foamFloat {
            0% { opacity: 0; transform: translateY(0) translateX(0) scale(0.6); }
            15% { opacity: 0.7; }
            40% { opacity: 0.3; transform: translateY(-18px) translateX(8px) scale(1); }
            70% { opacity: 0.1; }
            100% { opacity: 0; transform: translateY(-30px) translateX(-5px) scale(0.4); }
        }

        /* ===== БРЫЗГИ ===== */
        .spray-layer {
            position: absolute;
            bottom: 20%;
            left: 0;
            width: 100%;
            height: 30%;
            z-index: 5;
            pointer-events: none;
        }
        .spray-dot {
            position: absolute;
            border-radius: 50%;
            animation: sprayUp var(--sd) ease-out infinite;
            animation-delay: var(--sdel);
            bottom: 0;
            left: var(--sx);
            width: var(--sw);
            height: var(--sh);
            transition: background 1.2s ease;
        }
        @keyframes sprayUp {
            0% { opacity: 0; transform: translateY(0) translateX(0); }
            10% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-55px) translateX(var(--sdx)); }
        }

        /* ===== БЛИКИ НА ВОДЕ ===== */
        .glitter-layer {
            position: absolute;
            bottom: 10%;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: 6;
            pointer-events: none;
        }
        .glitter-line {
            position: absolute;
            height: 1px;
            transition: background 1.2s ease;
            animation: glitterShine var(--gd) ease-in-out infinite;
            animation-delay: var(--gdel);
            bottom: var(--gy);
            left: var(--gx);
            width: var(--gw);
            transform: rotate(var(--gr));
        }
        @keyframes glitterShine {
            0%, 100% { opacity: 0; }
            30% { opacity: 0.7; }
            60% { opacity: 0.15; }
        }

        /* ===== КОНТЕНТ ===== */
.content-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}
.message-block {
    text-align: center;
    animation: messageAppear 2s ease-out 0.6s both;
    pointer-events: auto;
    width: 90%;
    max-width: 500px;
}
@keyframes messageAppear {
    0% { opacity: 0; transform: translateY(40px); }
    100% { opacity: 1; transform: translateY(0); }
}
        /* ===== ОВЕРЛЕЙ (РАЗВОРОТ ИЗОБРАЖЕНИЯ) ===== */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s ease;
}

.overlay.active {
    pointer-events: auto;
    opacity: 1;
}

.overlay-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 0;
}

.overlay-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 90vw;
    max-height: 85vh;
    max-height: 85dvh;
    animation: overlayIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes overlayIn {
    0% {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
    }
    100% {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.overlay-image {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 55vh;
    max-height: 55dvh;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
    transition: transform 0.3s ease;
}

.overlay-info {
    text-align: center;
    margin-top: 1.5rem;
    animation: overlayInfoIn 0.6s ease 0.2s both;
}

@keyframes overlayInfoIn {
    0% {
        opacity: 0;
        transform: translateY(15px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

.overlay-title {
    font-size: clamp(1.3rem, 3vw, 2rem);
    color: #ffffff;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 0.6rem;
    font-weight: bold;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
}

.overlay-desc {
    font-size: clamp(0.8rem, 1.5vw, 0.95rem);
    color: rgba(255, 255, 255, 0.8);
    line-height: 1.6;
    max-width: 450px;
    margin: 0 auto 1.5rem;
    font-style: italic;
    letter-spacing: 0.5px;
}

.overlay-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.5);
    color: #ffffff;
    padding: 0.7rem 2rem;
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: clamp(0.7rem, 1.5vw, 0.8rem);
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    min-height: 44px;
}

.overlay-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: #ffffff;
    letter-spacing: 5px;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
}

.overlay-btn:active {
    transform: scale(0.95);
    transition: transform 0.1s ease;
}

/* Кнопка закрытия (крестик) */
.overlay-close {
    position: absolute;
    top: clamp(15px, 3vh, 25px);
    right: clamp(15px, 3vw, 25px);
    z-index: 3;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #ffffff;
    width: clamp(36px, 8vw, 44px);
    height: clamp(36px, 8vw, 44px);
    border-radius: 50%;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    animation: overlayInfoIn 0.6s ease 0.4s both;
}

.overlay-close:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: #ffffff;
}

.overlay-close:active {
    transform: scale(0.9);
}

/* Адаптив оверлея */
@media (max-width: 480px) {
    .overlay-content {
        max-width: 95vw;
    }
    .overlay-image {
        max-height: 45vh;
        border-radius: 6px;
    }
    .overlay-info {
        margin-top: 1rem;
    }
    .overlay-desc {
        max-width: 90%;
    }
    .overlay-btn {
        padding: 0.6rem 1.5rem;
    }
}

@media (orientation: landscape) {
    .overlay-content {
        flex-direction: row;
        gap: 2rem;
        max-width: 85vw;
    }
    .overlay-image {
        max-height: 60vh;
        max-width: 55%;
    }
    .overlay-info {
        text-align: left;
        margin-top: 0;
        max-width: 40%;
    }
    .overlay-desc {
        margin: 0 0 1.5rem 0;
        font-size: 0.8rem;
    }
}

/* ===== КАРУСЕЛЬ ===== */
.carousel-wrapper {
    position: relative;
    width: 100%;
    max-height: 55vh;
    aspect-ratio: 16 / 10;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 1.2rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transition: box-shadow 1.2s ease;
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    touch-action: pan-y pinch-zoom;
}

.carousel-track {
    position: relative;
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
}

.carousel-slide {
    min-width: 100%;
    flex-shrink: 0;
}

.carousel-slide img {

    <script>
        // ===== ПАРАМЕТРЫ ТЕМ =====
        const themeData = [
    {
        name: 'Чёрное море · Белое небо',
        skyColors: ['#faf8f4', '#f0ece4', '#e8e4dc', '#ddd8ce'],
        oceanColors: ['#0d1b1e', '#0a1517', '#060e0f'],
        waveColors: ['#0f2024', '#0a181c', '#081215', '#061014'],
        foamColors: ['#1a3038', '#14262d', '#0f1e24'],
        isDarkSky: false
    },
    {
        name: 'Белое море · Красное небо',
        skyColors: ['#8b1a1a', '#6b1010', '#4a0808', '#2a0404'],
        oceanColors: ['#f5f0e8', '#ede6da', '#e5dcd0'],
        waveColors: ['#faf6f0', '#f0eae0', '#e8e0d4', '#e0d8cc'],
        foamColors: ['#e0d8cc', '#d8cec0', '#d0c8b8'],
        isDarkSky: true
    },
    {
        name: 'Красное море · Чёрное небо',
        skyColors: ['#1a1a1a', '#0f0f0f', '#050505', '#000000'],
        oceanColors: ['#8b1a0a', '#6b0f05', '#4a0802'],
        waveColors: ['#9b2a15', '#7a1808', '#5a0d03', '#3a0500'],
        foamColors: ['#a04030', '#803020', '#602010'],
        isDarkSky: true
    },
    {
        name: 'Белое море · Чёрное небо',
        skyColors: ['#1a1a1a', '#0f0f0f', '#050505', '#000000'],
        oceanColors: ['#f5f0e8', '#ede6da', '#e5dcd0'],
        waveColors: ['#faf6f0', '#f0eae0', '#e8e0d4', '#e0d8cc'],
        foamColors: ['#e0d8cc', '#d8cec0', '#d0c8b8'],
        isDarkSky: true
    }
];

        let currentTheme = 0;

        // ===== ГЕНЕРАЦИЯ ВОЛН (SVG для реалистичности) =====
        function generateWavePath(seed, complexity) {
            let path = 'M0 60 ';
            const points = 12 + complexity;
            for (let i = 1; i <= points; i++) {
                const x = (i / points) * 100;
                const y = 40 + Math.sin(i * seed * 0.7 + seed) * 18 + Math.sin(i * seed * 1.3) * 10 + Math.cos(i * 0.5 + seed * 2) * 8;
                path += `L${x} ${y} `;
            }
            path += 'L100 100 L0 100 Z';
            return path;
        }

        function buildWaves() {
            const ocean = document.getElementById('oceanLayer');
            ocean.innerHTML = '';

            const waveConfigs = [
                { cls: 'wave-1 wave-1-anim', seed: 1.2, complexity: 6, opacity: 0.85 },
                { cls: 'wave-2 wave-2-anim', seed: 2.5, complexity: 8, opacity: 0.7 },
                { cls: 'wave-3 wave-3-anim', seed: 3.8, complexity: 10, opacity: 0.9 },
                { cls: 'wave-4 wave-4-anim', seed: 5.1, complexity: 7, opacity: 0.95 }
            ];

            waveConfigs.forEach((cfg, idx) => {
                const row = document.createElement('div');
                row.className = 'wave-row ' + cfg.cls;
                row.style.opacity = cfg.opacity;
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('viewBox', '0 0 100 100');
                svg.setAttribute('preserveAspectRatio', 'none');
                svg.style.width = '100%';
                svg.style.height = '100%';
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', generateWavePath(cfg.seed, cfg.complexity));
                path.setAttribute('fill', themeData[currentTheme].waveColors[idx] || themeData[currentTheme].oceanColors[0]);
                path.setAttribute('stroke', 'none');
                path.classList.add('wave-path');
                svg.appendChild(path);
                row.appendChild(svg);
                ocean.appendChild(row);
            });
        }

    function updateWaveColors() {
    const paths = document.querySelectorAll('.wave-path');
    const td = themeData[currentTheme];
    paths.forEach((p, i) => {
        if (td.waveColors && td.waveColors[i]) {
            p.setAttribute('fill', td.waveColors[i]);
        } else if (td.oceanColors) {
            p.setAttribute('fill', td.oceanColors[0]);
        }
    });
    
    // Обновляем пену
    const foamBlobs = document.querySelectorAll('.foam-blob');
    foamBlobs.forEach(blob => {
        if (td.foamColors) {
            blob.style.background = td.foamColors[Math.floor(Math.random() * td.foamColors.length)];
        }
    });
}

        // ===== ГЕНЕРАЦИЯ АТМОСФЕРЫ =====
        function buildAtmosphere() {
            const layer = document.getElementById('atmosphereLayer');
            layer.innerHTML = '';
            const td = themeData[currentTheme];
            const count = td.isDarkSky ? 70 : 35;

            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.classList.add('atmo-particle');
                p.style.left = Math.random() * 96 + '%';
                p.style.top = Math.random() * 92 + '%';
                const size = td.isDarkSky ? (1 + Math.random() * 2.5) : (3 + Math.random() * 8);
                p.style.width = size + 'px';
                p.style.height = (td.isDarkSky ? size : size * 0.6) + 'px';
                p.style.opacity = td.isDarkSky ? (0.4 + Math.random() * 0.6) : (0.2 + Math.random() * 0.3);
                p.style.background = td.isDarkSky ? '#ffffff' : '#c8c0b0';
                p.style.animation = td.isDarkSky
                    ? `starTwinkle ${3 + Math.random() * 5}s ease-in-out ${Math.random() * 5}s infinite`
                    : `cloudDrift ${5 + Math.random() * 8}s ease-in-out ${Math.random() * 6}s infinite`;
                layer.appendChild(p);
            }
        }

        // ===== ГЕНЕРАЦИЯ ПЕНЫ =====
        function buildFoam() {
            const layer = document.getElementById('foamLayer');
            layer.innerHTML = '';
            const td = themeData[currentTheme];
            for (let i = 0; i < 25; i++) {
                const blob = document.createElement('div');
                blob.classList.add('foam-blob');
                blob.style.setProperty('--fx', Math.random() * 90 + '%');
                blob.style.setProperty('--fy', (5 + Math.random() * 30) + '%');
                const s = 4 + Math.random() * 16;
                blob.style.setProperty('--fw', s + 'px');
                blob.style.setProperty('--fh', s * 0.5 + 'px');
                blob.style.setProperty('--fd', (3 + Math.random() * 6) + 's');
                blob.style.setProperty('--fdel', Math.random() * 5 + 's');
                blob.style.background = td.foamColors[Math.floor(Math.random() * 3)];
                layer.appendChild(blob);
            }
        }

        // ===== ГЕНЕРАЦИЯ БРЫЗГ =====
        function buildSpray() {
            const layer = document.getElementById('sprayLayer');
            layer.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                const dot = document.createElement('div');
                dot.classList.add('spray-dot');
                dot.style.setProperty('--sx', (2 + Math.random() * 96) + '%');
                dot.style.setProperty('--sw', (1.5 + Math.random() * 3.5) + 'px');
                dot.style.setProperty('--sh', dot.style.getPropertyValue('--sw'));
                dot.style.setProperty('--sd', (1 + Math.random() * 2.5) + 's');
                dot.style.setProperty('--sdel', Math.random() * 3 + 's');
                dot.style.setProperty('--sdx', (-10 + Math.random() * 20) + 'px');
                layer.appendChild(dot);
            }
        }

        // ===== ГЕНЕРАЦИЯ БЛИКОВ =====
        function buildGlitter() {
            const layer = document.getElementById('glitterLayer');
            layer.innerHTML = '';
            for (let i = 0; i < 22; i++) {
                const line = document.createElement('div');
                line.classList.add('glitter-line');
                line.style.setProperty('--gx', Math.random() * 95 + '%');
                line.style.setProperty('--gy', (3 + Math.random() * 92) + '%');
                line.style.setProperty('--gw', (15 + Math.random() * 55) + 'px');
                line.style.setProperty('--gr', (-18 + Math.random() * 36) + 'deg');
                line.style.setProperty('--gd', (1.8 + Math.random() * 4) + 's');
                line.style.setProperty('--gdel', Math.random() * 4.5 + 's');
                layer.appendChild(line);
            }
        }

        // ===== ПРИМЕНЕНИЕ ТЕМЫ =====
    function applyTheme(idx) {
    currentTheme = idx;
    document.body.className = 'theme-' + idx;
    
    const indicator = document.getElementById('themeIndicator');
    if (indicator) {
        indicator.textContent = themeData[idx].name;
        indicator.style.transform = 'translateX(-50%) scale(1.35)';
        setTimeout(() => {
            if (indicator) indicator.style.transform = 'translateX(-50%) scale(1)';
        }, 250);
    }
    
    // Обновляем цвет theme-color для навбара
    const themeColorMeta = document.getElementById('themeColorMeta');
    const oceanColorsMap = ['#0a1517', '#ede6da', '#6b0f05', '#ede6da'];
    if (themeColorMeta) {
        themeColorMeta.setAttribute('content', oceanColorsMap[idx]);
    }
    
    // Перестраиваем волны с новыми цветами
    buildWaves();
    buildAtmosphere();
    buildFoam();
    updateWaveColors();
    
    // Скрываем подсказку при первом свайпе
    const hint = document.getElementById('swipeHint');
    if (hint && hint.style.opacity !== '0' && idx !== 0) {
        hint.style.transition = 'opacity 0.5s ease';
        hint.style.opacity = '0';
        setTimeout(() => {
            if (hint) hint.style.display = 'none';
        }, 500);
    }
    
    // Вибрация на мобильных
    if (navigator.vibrate) navigator.vibrate(12);
}

// Слушаем смену ориентации — обновляем навбар
window.matchMedia('(orientation: landscape)').addEventListener('change', () => {
    applyTheme(currentTheme);
});
        // ===== СВАЙП ДЛЯ СМЕНЫ ТЕМЫ =====
let touchStartY = 0, touchEndY = 0, isSwiping = false;
let swipeTarget = null; // отслеживаем, где начался свайп

document.addEventListener('touchstart', e => {
    touchStartY = e.touches[0].clientY;
    isSwiping = true;
    swipeTarget = e.target; // запоминаем элемент, на котором начался свайп
}, { passive: true });

document.addEventListener('touchmove', e => {
    if (!isSwiping) return;
    touchEndY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', () => {
    if (!isSwiping) return;
    isSwiping = false;
    
    // Если свайп начался внутри карусели — не меняем тему
    if (swipeTarget && swipeTarget.closest('.carousel-wrapper')) {
        touchStartY = 0;
        touchEndY = 0;
        swipeTarget = null;
        return;
    }
    
    const d = touchEndY - touchStartY;
    if (d > 55) applyTheme((currentTheme + 1) % 4);
    else if (d < -55) applyTheme((currentTheme - 1 + 4) % 4);
    
    touchStartY = 0;
    touchEndY = 0;
    swipeTarget = null;
});

        // колёсико
        let wheelAcc = 0;
        document.addEventListener('wheel', e => {
            wheelAcc += e.deltaY;
            if (wheelAcc > 70) { applyTheme((currentTheme + 1) % 4); wheelAcc = 0; }
            else if (wheelAcc < -70) { applyTheme((currentTheme - 1 + 4) % 4); wheelAcc = 0; }
        }, { passive: true });

        // автоскрытие подсказки
        setTimeout(() => {
            const hint = document.getElementById('swipeHint');
            if (currentTheme === 0 && hint.style.opacity !== '0') {
                hint.style.transition = 'opacity 0.5s ease';
                hint.style.opacity = '0';
                setTimeout(() => hint.style.display = 'none', 500);
            }
        }, 10000);

        // ===== ДВИЖЕНИЕ ЛУНЫ =====
        const moonContainer = document.getElementById('moonContainer');
        if (!('ontouchstart' in window)) {
            document.addEventListener('mousemove', e => {
                const x = (e.clientX / window.innerWidth - 0.5) * 30;
                const y = (e.clientY / window.innerHeight - 0.5) * 30;
                moonContainer.style.transform = `translate(${x}px, ${y}px)`;
                moonContainer.style.transition = 'transform 1.5s ease-out';
            });
        }

        // ===== СТАРТ =====
        buildWaves();
        buildAtmosphere();
        buildFoam();
        buildSpray();
        buildGlitter();

        // анимация звёзд и облаков (ключевые кадры в стилях не работают для динамики, добавим)
        const styleAdd = document.createElement('style');
        styleAdd.textContent = `
            @keyframes starTwinkle {
                0%, 100% { opacity: 0.3; transform: scale(1); }
                50% { opacity: 1; transform: scale(1.6); }
            }
            @keyframes cloudDrift {
                0%, 100% { transform: translateX(0); opacity: 0.3; }
                50% { transform: translateX(18px); opacity: 0.5; }
            }
        `;
        document.head.appendChild(styleAdd);
    // ===== КАРУСЕЛЬ (ПРОСТАЯ РАБОЧАЯ ВЕРСИЯ) =====
const track = document.getElementById('carouselTrack');
const dotsContainer = document.getElementById('carouselDots');
const prevBtn = document.getElementById('carouselPrev');
const nextBtn = document.getElementById('carouselNext');
const slides = document.querySelectorAll('.carousel-slide');
const totalSlides = slides.length;

let currentIndex = 0;
let isTransitioning = false;
let autoplayInterval;
let touchStartX = 0;
let touchEndX = 0;

// Устанавливаем начальную позицию
track.style.transition = 'transform 0.5s ease-in-out';
track.style.transform = 'translateX(0%)';

// Создаём точки
dotsContainer.innerHTML = '';
for (let i = 0; i < totalSlides; i++) {
    const dot = document.createElement('button');
    dot.classList.add('carousel-dot');
    if (i === 0) dot.classList.add('active');
    dot.addEventListener('click', () => {
        if (isTransitioning) return;
        goToSlide(i);
        resetAutoplay();
    });
    dotsContainer.appendChild(dot);
}

function updateDots() {
    const dots = document.querySelectorAll('.carousel-dot');
    dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
    });
}

function goToSlide(index) {
    if (isTransitioning || index === currentIndex) return;
    isTransitioning = true;
    currentIndex = index;
    track.style.transform = `translateX(-${currentIndex * 100}%)`;
    updateDots();
    setTimeout(() => { isTransitioning = false; }, 500);
}

function nextSlide() {
    if (isTransitioning) return;
    const next = (currentIndex + 1) % totalSlides;
    goToSlide(next);
}

function prevSlide() {
    if (isTransitioning) return;
    const prev = (currentIndex - 1 + totalSlides) % totalSlides;
    goToSlide(prev);
}

// Кнопки
nextBtn.addEventListener('click', () => { nextSlide(); resetAutoplay(); });
prevBtn.addEventListener('click', () => { prevSlide(); resetAutoplay(); });

// Свайп
const carouselWrapper = document.querySelector('.carousel-wrapper');
carouselWrapper.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    clearInterval(autoplayInterval);
}, { passive: true });

carouselWrapper.addEventListener('touchend', (e) => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) {
        if (diff > 0) nextSlide();
        else prevSlide();
    }
    resetAutoplay();
});

// Автопрокрутка
function startAutoplay() { autoplayInterval = setInterval(nextSlide, 4000); }
function resetAutoplay() { clearInterval(autoplayInterval); startAutoplay(); }
startAutoplay();

// Пауза при наведении
carouselWrapper.addEventListener('mouseenter', () => clearInterval(autoplayInterval));
carouselWrapper.addEventListener('mouseleave', startAutoplay);
        
// ===== ОВЕРЛЕЙ (РАЗВОРОТ ПО ТАПУ) =====
const overlay = document.getElementById('overlay');
const overlayBg = document.getElementById('overlayBg');
const overlayImage = document.getElementById('overlayImage');
const overlayTitle = document.getElementById('overlayTitle');
const overlayDesc = document.getElementById('overlayDesc');
const overlayBtn = document.getElementById('overlayBtn');
const overlayClose = document.getElementById('overlayClose');

function openOverlay(slideElement) {
    const img = slideElement.querySelector('img');
    const title = slideElement.getAttribute('data-title') || 'Без названия';
    const desc = slideElement.getAttribute('data-desc') || '';
    
    overlayImage.src = img.src;
    overlayImage.alt = img.alt;
    overlayTitle.textContent = title;
    overlayDesc.textContent = desc;
    
    clearInterval(autoplayInterval);
    document.body.style.overflow = 'hidden';
    overlay.classList.add('active');
}

function closeOverlay() {
    overlay.classList.remove('active');
    document.body.style.overflow = '';
    startAutoplay();
}

// Тап по слайду в карусели (используем существующий carouselWrapper из кода карусели)
if (carouselWrapper) {
    carouselWrapper.addEventListener('click', function(e) {
        if (e.target.closest('.carousel-arrow') || e.target.closest('.carousel-dot')) return;
        const slide = e.target.closest('.carousel-slide');
        if (!slide) return;
        openOverlay(slide);
    });
}

// Кнопка закрытия
overlayClose.addEventListener('click', closeOverlay);
overlayBtn.addEventListener('click', closeOverlay);
overlayBg.addEventListener('click', closeOverlay);

// Свайп вниз на оверлее — закрыть
let overlayTouchStartY = 0;
overlay.addEventListener('touchstart', function(e) {
    overlayTouchStartY = e.touches[0].clientY;
}, { passive: true });

overlay.addEventListener('touchend', function(e) {
    const diff = e.changedTouches[0].clientY - overlayTouchStartY;
    if (diff > 60) {
        closeOverlay();
    }
});

// Escape на клавиатуре
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('active')) {
        closeOverlay();
    }
});
    </script>
</body>
